<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Banking Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .header-bar h2 { border-bottom: none; }
        .card { background: #34495e; color: white; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .balance-val { font-size: 32px; font-weight: bold; color: #2ecc71; }
        input, button { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #bdc3c7; }
        button { background: #27ae60; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #219653; }
        .logout-btn { background: #c0392b; width: auto; padding: 8px 16px; font-size: 14px; margin: 0; }
        .logout-btn:hover { background: #a93226; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f2f2f2; }
        .hidden { display: none; }
        .toggle-link { color: #2980b9; cursor: pointer; text-align: center; display: block; margin-top: 15px; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <!-- AUTHENTICATION PANELS -->
    <div id="authSection">
        <!-- LOGIN VIEW -->
        <div id="loginCard">
            <h2>Secure User Authentication</h2>
            <input type="text" id="loginUsername" placeholder="Username (e.g., alice)">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="login()">Sign In</button>
            <span class="toggle-link" onclick="toggleAuth(true)">New client? Register here</span>
        </div>

        <!-- DYNAMIC REGISTER VIEW -->
        <div id="registerCard" class="hidden">
            <h2>Create New Custom Bank Account</h2>
            <input type="text" id="regUsername" placeholder="Choose a Unique Username">
            <input type="password" id="regPassword" placeholder="Choose a Secure Password">
            <button onclick="register()" style="background:#2980b9;">Open Free Account (₹1,000 Starting Gift)</button>
            <span class="toggle-link" onclick="toggleAuth(false)">Already a member? Sign In</span>
        </div>
    </div>

    <!-- MAIN DASHBOARD VIEW -->
    <div id="dashboardSection" class="hidden">
        <div class="header-bar">
            <h2>Welcome back, <span id="userDisplay" style="color:#2980b9;"></span>!</h2>
            <button class="logout-btn" onclick="logout()">Secure Logout</button>
        </div>
        
        <div class="card">
            <div>Account Number: <span id="accDisplay" style="font-weight:bold;"></span></div>
            <div style="margin-top:10px;">Available Balance</div>
            <div class="balance-val">₹<span id="balanceDisplay">0.00</span></div>
        </div>

        <h2>Fund Transfer</h2>
        <input type="text" id="toAccount" placeholder="Destination Account Number (e.g., ACC1002)">
        <input type="number" id="transferAmount" placeholder="Amount (₹)">
        <button onclick="executeTransfer()" style="background:#e67e22;">Send Money</button>

        <h2>Transaction History Audit Logs</h2>
        <table>
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Source</th>
                    <th>Destination</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="historyRows"></tbody>
        </table>
    </div>
</div>

<script>
    let jwtToken = "";
    let myAccountNumber = "";

    function toggleAuth(showRegister) {
        if(showRegister) {
            document.getElementById("loginCard").classList.add("hidden");
            document.getElementById("registerCard").classList.remove("hidden");
        } else {
            document.getElementById("registerCard").classList.add("hidden");
            document.getElementById("loginCard").classList.remove("hidden");
        }
    }

    async function register() {
        const u = document.getElementById("regUsername").value;
        const p = document.getElementById("regPassword").value;
        if(!u || !p) { alert("Fields cannot be empty."); return; }
        
        try {
            const res = await fetch("http://localhost:8080/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: u, password: p })
            });
            const message = await res.text();
            if(!res.ok) throw new Error(message);
            
            alert(message); // Displays generation success and assigned account string
            toggleAuth(false); // Toggle view to log them in
            document.getElementById("loginUsername").value = u;
        } catch (err) { alert("⚠️ Registration Failed: " + err.message); }
    }

    async function login() {
        const u = document.getElementById("loginUsername").value;
        const p = document.getElementById("loginPassword").value;
        try {
            const res = await fetch("http://localhost:8080/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: u, password: p })
            });
            const text = await res.text();
            if(!res.ok) throw new Error(text);
            jwtToken = text;
            
            document.getElementById("authSection").classList.add("hidden");
            document.getElementById("dashboardSection").classList.remove("hidden");
            document.getElementById("userDisplay").innerText = u;
            
            await updateDashboard();
        } catch (err) { alert("Login Error: " + err.message); }
    }

    function logout() {
        jwtToken = ""; myAccountNumber = "";
        document.getElementById("loginUsername").value = "";
        document.getElementById("loginPassword").value = "";
        document.getElementById("regUsername").value = "";
        document.getElementById("regPassword").value = "";
        document.getElementById("dashboardSection").classList.add("hidden");
        document.getElementById("authSection").classList.remove("hidden");
        toggleAuth(false);
    }

    async function updateDashboard() {
        const res = await fetch("http://localhost:8080/api/banking/balance", {
            headers: { "Authorization": "Bearer " + jwtToken }
        });
        const accountData = await res.json();
        myAccountNumber = accountData.accountNumber;
        
        document.getElementById("accDisplay").innerText = myAccountNumber;
        document.getElementById("balanceDisplay").innerText = parseFloat(accountData.balance).toFixed(2);
        
        const histRes = await fetch(`http://localhost:8080/api/banking/history?accountNumber=${myAccountNumber}`, {
            headers: { "Authorization": "Bearer " + jwtToken }
        });
        const historyData = await histRes.json();
        
        let rows = "";
        historyData.forEach(tx => {
            rows += `<tr>
                <td>${tx.timestamp.replace("T", " ")}</td>
                <td>${tx.sourceAccount}</td>
                <td>${tx.destinationAccount}</td>
                <td style="color:${tx.sourceAccount === myAccountNumber ? 'red':'green'}">
                    ${tx.sourceAccount === myAccountNumber ? '-':'+'}₹${parseFloat(tx.amount).toFixed(2)}
                </td>
            </tr>`;
        });
        document.getElementById("historyRows").innerHTML = rows;
    }

    async function executeTransfer() {
        const to = document.getElementById("toAccount").value;
        const amt = document.getElementById("transferAmount").value;
        if (!to || !amt || amt <= 0) { alert("Enter valid parameters."); return; }
        try {
            const res = await fetch(`http://localhost:8080/api/banking/transfer?from=${myAccountNumber}&to=${to}&amount=${amt}`, {
                method: "POST",
                headers: { "Authorization": "Bearer " + jwtToken }
            });
            const text = await res.text();
            if(!res.ok) throw new Error(text);
            alert(text);
            await updateDashboard();
        } catch (err) { alert("⚠️ Error: " + err.message); }
    }
</script>
</body>
</html>
